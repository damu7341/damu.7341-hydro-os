<!DOCTYPE html>
<html lang="en">

</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYDRO OS S1</title>

    < link rel="stylesheet"href="style.css">
</head>

    </body>

     <!-- Main desktop -->

    <div class="desktop">

        <!-- Header -->

        <header>
            <h1>HYDRO OS</h1>
            <p>S1 EDITION</p>
        </header>

        <!-- Welcome section -->
        <section class="welcome">
            <h2>Welcome to HYDRO OS</h2>
            <p>Your Space. Your System. Your Universe.</p>
        </section>

        <!-- Widgets section -->

        <main class="widgets">

            <!-- Clock -->

            <div class="widget">
                <h2>Digital Clock</h2>
                <div id="clock">00:00:00</div>
                <p id="date">Loading date...</p>
            </div>

            <!-- Calculator -->

            <div class="widget">
                <h2>Calculator</h2>

                <input type="text" id="display" readonly>

                    <div id="calculator-buttons">
                    <!-- Calculator buttons go here -->
                </div>
            </div>

            <!-- Calendar -->

            <div class="widget">
                <h2>Calendar</h2>
                <div id="calendar">
                    <!-- Calendar will appear here -->
                </div>
            </div>

            <!-- Terminal -->

            <div class="widget">
                <h2>HYDRO Terminal</h2>

                <div id="terminal-output">
                    HYDRO OS Terminal Started.
                </div>

        </main>

          <!-- Footer -->

        </footer>
              <p>HYDRO OS S1 | Created by DAMU</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
    </html>
