<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hydro S - Space OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar"><div>Hydro S - Space Edition</div><div><span id="visits"></span> | <span id="time"></span></div></div>

<div class="widgets">
  <div class="widget" id="w-clock">
    <h3>CLOCK WIDGET</h3>
    <div id="clock">00:00</div>
    <div id="date"></div>
  </div>

  <div class="widget" id="w-cal">
    <h3>CALENDAR WIDGET</h3>
    <div id="calTitle"></div>
    <div class="calendar" id="calGrid"></div>
  </div>

  <div class="widget" id="w-calc">
    <h3>CALCULATOR WIDGET</h3>
    <input id="calcOut" readonly placeholder="0">
    <div class="keys">
      <button onclick="cPress('7')">7</button><button onclick="cPress('8')">8</button><button onclick="cPress('9')">9</button><button onclick="cPress('/')">/</button>
      <button onclick="cPress('4')">4</button><button onclick="cPress('5')">5</button><button onclick="cPress('6')">6</button><button onclick="cPress('*')">*</button>
      <button onclick="cPress('1')">1</button><button onclick="cPress('2')">2</button><button onclick="cPress('3')">3</button><button onclick="cPress('-')">-</button>
      <button onclick="cPress('0')">0</button><button onclick="cPress('.')">.</button><button onclick="cEqual()">=</button><button onclick="cPress('+')">+</button>
      <button onclick="cClear()" class="span2">CLEAR</button><button onclick="cBack()">⌫</button><button onclick="cPress('%')">%</button>
    </div>
  </div>

  <div class="widget" id="w-notes">
    <h3>NOTES WIDGET</h3>
    <textarea id="notes" placeholder="Space notes..."></textarea>
    <button onclick="saveN()" class="saveBtn">Save</button>
  </div>
</div>

<div class="taskbar">
  <button onclick="toggleW('w-clock')">Clock</button>
  <button onclick="toggleW('w-cal')">Calendar</button>
  <button onclick="toggleW('w-calc')">Calculator</button>
  <button onclick="toggleW('w-notes')">Notes</button>
  <button onclick="changeBG()">Wallpaper</button>
</div>

<script src="script.js"></script>
</body>
</html>
