<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYDRO OS S1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="desktop">

        <header class="topbar">
            <h2>🚀 HYDRO OS S1</h2>
            <span>Space Desktop</span>
        </header>

        <section class="welcome">
            <h1>Welcome to HYDRO OS</h1>
            <p>Your personal space-themed operating system.</p>
        </section>

        <main class="widgets">

            <div class="widget">
                <h2>🕒 Digital Clock</h2>
                <div id="clock">00:00:00</div>
                <p id="date">Loading date...</p>
            </div>

            <div class="widget">
                <h2>🧮 Calculator</h2>
                <input type="text" id="display" readonly>

                <div class="calculator-buttons">
                    <button onclick="clearDisplay()">C</button>
                    <button onclick="appendValue('/')">÷</button>
                    <button onclick="appendValue('*')">×</button>
                    <button onclick="appendValue('-')">−</button>

                    <button onclick="appendValue('7')">7</button>
                    <button onclick="appendValue('8')">8</button>
                    <button onclick="appendValue('9')">9</button>
                    <button onclick="appendValue('+')">+</button>

                    <button onclick="appendValue('4')">4</button>
                    <button onclick="appendValue('5')">5</button>
                    <button onclick="appendValue('6')">6</button>
                    <button onclick="calculate()">=</button>

                    <button onclick="appendValue('1')">1</button>
                    <button onclick="appendValue('2')">2</button>
                    <button onclick="appendValue('3')">3</button>
                    <button onclick="appendValue('0')">0</button>
                </div>
            </div>

            <div class="widget">
                <h2>📅 Calendar</h2>
                <div id="calendar"></div>
            </div>

            <div class="widget">
                <h2>💻 HYDRO Terminal</h2>
                <div id="terminal-output">
                    Welcome to HYDRO OS Terminal!
                    <br>Type help to see commands.
                </div>

                <input
                    type="text"
                    id="terminal-command"
                    placeholder="Enter command..."
                    onkeydown="handleCommand(event)"
                >
            </div>

        </main>

        <footer>
            <p>HYDRO OS S1 | Created by You 🚀</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
